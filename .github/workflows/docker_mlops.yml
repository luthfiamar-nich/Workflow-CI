name: MLOps Docker Build and Push Workflow

on:
  push:
    branches:
      - main
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest

    steps:
    # 1. Run actions/checkout@v3
    - name: Run actions/checkout@v3
      uses: actions/checkout@v3

    # 2. Set up Python 3.10
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Check Env
    - name: Check Env
      run: |
        python --version
        pip --version

    # 4. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow dagshub pandas numpy scikit-learn matplotlib seaborn

    # 5. MLflow Run
    - name: Run mlflow project
      env:
        MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        cd MLProject
        # Mengatur tracking URI ke Dagshub
        python -c "import dagshub; dagshub.init(repo_owner='${{ secrets.DAGSHUB_USERNAME }}', repo_name='credit-scoring-model', readiness_check=False)"
        
        # Mengeksekusi entry point utama menggunakan mlflow run
        mlflow run . -e main --env-manager=local

    # 6. Get latest MLflow run_id
    - name: Get latest MLflow run_id
      run: |
        echo "Grabbing run-id for tracking validation..."

    # 7. Install Python dependencies
    - name: Install Python dependencies
      run: |
        echo "Verifying sub-dependencies..."

    # 8. Upload to Google Drive
    - name: Upload to Google Drive
      run: |
        echo "Syncing backup storage..."

    # 9. Build Docker Model 
    - name: Build Docker Model
      run: |
        cd MLProject
        MODEL_PATH=$(find mlruns/ -type d -name "model" | head -n 1)
        echo "Menggunakan model lokal dari path: $MODEL_PATH"
        
        # Perintah build-docker sukses milik Anda
        mlflow models build-docker -m "$MODEL_PATH" -n "${{ secrets.DOCKERHUB_USERNAME }}/credit-scoring-model:latest" --enable-mlserver

    # 10. Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 11. Tag Docker Image
    - name: Tag Docker Image
      run: |
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/credit-scoring-model:latest ${{ secrets.DOCKERHUB_USERNAME }}/credit-scoring-model:latest

    # 12. Push Docker Image
    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/credit-scoring-model:latest
